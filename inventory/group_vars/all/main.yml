---
# Non-secret configuration for the M2 Ultra AI stack.
# Secrets live in group_vars/vault.yml (see vault.yml.example).

# --- Paths / platform -------------------------------------------------------
# Use the NATIVE (arm64) Homebrew only. /usr/local is x86_64 on this host.
brew_native_bin_dir: /opt/homebrew/bin
ai_base_dir: "{{ ansible_env.HOME }}/ai-box"
ai_logs_dir: "{{ ai_base_dir }}/logs"
# Host uid/gid, used so the Authelia container can read its 0600 config files.
ai_uid: "{{ ansible_user_uid }}"
ai_gid: "{{ ansible_user_gid }}"

# --- Networking / public edge ----------------------------------------------
# Second DuckDNS name pointing at the same home IP (see README).
ai_hostname: beranci-ai.duckdns.org
webui_port: 3000
ollama_host_port: 11434
reranker_port: 7997
dozzle_port: 8088

# --- Ollama (native arm64, Metal) ------------------------------------------
ollama_models:
  - llama3.3:70b-instruct-q4_K_M
  - qwen2.5:32b
  - llama3.1:8b
  - mxbai-embed-large
  # Reasoning models (emit a separate chain-of-thought that Open WebUI renders
  # in a collapsible "Thinking" panel).
  - qwen3:32b
  - deepseek-r1:32b
  # - qwen2.5-coder:32b          # optional code model; uncomment to include

# Derived models with a baked 32k context. Ollama 0.34 auto-picks a context from
# available VRAM and otherwise loads the 70B at its 131072 max, which overflows
# the 56 GB wired limit and spills ~11% to CPU. Pick these "-32k" variants in
# Open WebUI. They share blobs with the base models, so they cost no extra disk.
# Reasoning models generate many more tokens, so the bounded context matters more.
ollama_chat_models:
  - name: llama3.3-70b-32k
    base: llama3.3:70b-instruct-q4_K_M
  - name: qwen2.5-32b-32k
    base: qwen2.5:32b
  - name: llama3.1-8b-32k
    base: llama3.1:8b
  - name: qwen3-32b-32k
    base: qwen3:32b
  - name: deepseek-r1-32b-32k
    base: deepseek-r1:32b
# Context length baked into the derived "-32k" chat models. Ollama 0.34's own
# OLLAMA_CONTEXT_LENGTH is superseded by a VRAM-based default, so this value is
# applied per-model at build time instead. 32k keeps the 70B within the wired limit.
ollama_context_length: 32768
# Unload a resident model after 30m so a 43 GB 70B does not pin memory forever.
# Set to "-1" to keep models loaded permanently (article default).
ollama_keep_alive: 30m

# --- Metal GPU memory -------------------------------------------------------
# Default Metal cap is ~75% of 64 GB (~48 GB). Raise to 56 GB for the 70B Q4.
iogpu_wired_limit_mb: 57344

# --- RAG / reranking --------------------------------------------------------
rag_embedding_model: mxbai-embed-large
reranker_model: BAAI/bge-reranker-v2-m3
reranking_engine: external            # external (Infinity/MPS) | local (Open WebUI built-in)
reranking_engine_effective: "{{ reranking_engine }}"

# --- Optional services ------------------------------------------------------
open_terminal_enabled: true
dozzle_enabled: true

# --- Edge auth --------------------------------------------------------------
# HTTP basic auth is OFF: Chrome re-prompts on every SPA request (XHR/WebSocket/
# service-worker) because a cached basic-auth credential does not cover them.
# Access is instead protected by Open WebUI's own login, with public signup
# disabled and an admin account created headlessly from the vault.
caddy_basic_auth_enabled: false
webui_enable_signup: false

# --- Edge 2FA (Authelia) ----------------------------------------------------
# Open WebUI has no native 2FA, so TOTP is enforced at the edge: Caddy
# forward_auth -> Authelia. Authelia uses cookie sessions, so (unlike basic
# auth) the SPA is not re-prompted. Single instance => in-memory session store,
# no Redis needed. The portal is served on the /authelia subpath of the same
# hostname because DuckDNS cannot share cookies across separate names.
authelia_enabled: true
authelia_image: authelia/authelia:latest
authelia_port: 9091

# --- Container images -------------------------------------------------------
# Native arm64 images only; never the :cuda variants on Apple Silicon.
# Pin explicit versions for production. TODO: pin these.
webui_image: ghcr.io/open-webui/open-webui:main
qdrant_image: qdrant/qdrant:latest
tika_image: apache/tika:latest-full
searxng_image: searxng/searxng:latest
open_terminal_image: ghcr.io/open-webui/open-terminal:latest
dozzle_image: amir20/dozzle:latest

# --- Caddy (native install already present) ---------------------------------
caddy_bin: /usr/local/bin/caddy
caddy_config_file: "{{ ansible_env.HOME }}/Caddyfile"
# Caddy must bind :80/:443, which needs root, so it is managed as a LaunchDaemon.
caddy_launchd_label: com.otto.caddy
caddy_plist_path: /Library/LaunchDaemons/com.otto.caddy.plist
