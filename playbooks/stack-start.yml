---
# Starts the whole AI stack (native services first, then containers), without
# re-pulling models or reinstalling anything. Full rebuild: playbooks/site.yml
- name: Start the M2 Ultra AI stack
  hosts: m2ultra
  gather_facts: true
  tasks:
    - name: Ensure privilege escalation is available (needed for the Caddy daemon)
      ansible.builtin.command: /usr/bin/true
      become: true
      changed_when: false

    - name: Check the Docker daemon
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false
      failed_when: false

    - name: Launch Docker Desktop when the daemon is not running
      ansible.builtin.command: /usr/bin/open -a Docker
      when: docker_info.rc != 0
      changed_when: true

    - name: Wait for the Docker daemon
      ansible.builtin.command: docker info
      register: docker_wait
      until: docker_wait.rc == 0
      retries: 30
      delay: 3
      when: docker_info.rc != 0
      changed_when: false
      failed_when: false

    # bootstrap loads it if needed; kickstart -k restarts it if already loaded.
    - name: Start the native user services (Ollama, Infinity reranker)
      ansible.builtin.shell: >-
        launchctl bootstrap gui/$(id -u) {{ item.plist }} 2>/dev/null;
        launchctl kickstart -k gui/$(id -u)/{{ item.label }}
      loop:
        - { label: "{{ ollama_launchd_label }}", plist: "{{ ollama_plist_path }}" }
        - { label: "{{ reranker_launchd_label }}", plist: "{{ reranker_plist_path }}" }
      register: start_user
      changed_when: start_user.rc == 0
      failed_when: false

    - name: Start the native root service (Caddy)
      ansible.builtin.shell: >-
        launchctl bootstrap system {{ caddy_plist_path }} 2>/dev/null;
        launchctl kickstart -k system/{{ caddy_launchd_label }}
      become: true
      register: start_root
      changed_when: start_root.rc == 0
      failed_when: false

    - name: Bring up the container stack
      community.docker.docker_compose_v2:
        project_src: "{{ ai_base_dir }}"
        files:
          - docker-compose.yml
        project_name: ai-box-stack
        state: present
        wait: true
        wait_timeout: 300
        remove_orphans: true

    - name: Wait for the Ollama API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ollama_host_port }}/api/tags"
        status_code: 200
      register: o
      until: o.status == 200
      retries: 30
      delay: 2
      changed_when: false
      failed_when: false

    - name: Wait for Open WebUI
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ webui_port }}/"
        status_code: 200
      register: w
      until: w.status == 200
      retries: 40
      delay: 3
      changed_when: false
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg:
          - "Docker daemon: up"
          - "Containers: brought up ({{ ai_base_dir }}/docker-compose.yml)"
          - "Ollama API: {{ o.status | default('unreachable') }}"
          - "Open WebUI: {{ w.status | default('unreachable') }}"
          - "Public entrypoint: https://{{ ai_hostname }} (Authelia 2FA)"
